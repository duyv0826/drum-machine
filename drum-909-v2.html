<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRUM-909 V2 · 网页鼓机</title>
<meta name="description" content="纯 Web Audio 实时合成的网页鼓机音序器 V2：4 组音色库、循环曲模式、重音、每轨音量、TAP 测速、分享链接，单文件零依赖。">
<meta name="theme-color" content="#0b0e14">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e14'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%235df0a8' stroke-width='3'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b0e14;
    --panel: #121724;
    --line: #232b3f;
    --text: #e8ecf4;
    --dim: #8b93a7;
    --accent: #6c8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #1b2438 0%, var(--bg) 60%);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 28px 16px 48px;
  }

  .machine {
    width: 920px;
    max-width: 100%;
    background: linear-gradient(180deg, #151b2c 0%, var(--panel) 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 22px 24px 18px;
    box-shadow: 0 24px 60px -24px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.02) inset;
  }

  /* ---------- header ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 46px; height: 46px; border-radius: 12px;
    background: linear-gradient(145deg, #2a3554, #171e31);
    border: 1px solid #33406a;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; color: #5df0a8;
    box-shadow: 0 0 18px -4px rgba(93,240,168,.55);
  }
  .brand h1 { font-size: 20px; letter-spacing: 3px; font-weight: 700; }
  .brand p  { font-size: 12px; color: var(--dim); margin-top: 2px; letter-spacing: 1px; }
  .badge {
    font-size: 11px; color: #5df0a8; border: 1px solid rgba(93,240,168,.35);
    padding: 4px 10px; border-radius: 999px; letter-spacing: 1px;
    background: rgba(93,240,168,.06);
  }

  /* ---------- transport ---------- */
  .transport {
    display: flex; align-items: center; gap: 18px;
    background: #0d1220; border: 1px solid var(--line); border-radius: 14px;
    padding: 14px 18px; margin-bottom: 14px;
  }
  .play-btn {
    width: 62px; height: 62px; border-radius: 50%;
    font-size: 22px; line-height: 1;
    background: linear-gradient(145deg, #1f2a44, #141b2e);
    border: 1px solid #34406a; color: #7ef0b2;
    cursor: pointer; flex: 0 0 auto;
    transition: box-shadow .15s, transform .05s;
  }
  .play-btn:hover { box-shadow: 0 0 22px -4px rgba(126,240,178,.5); }
  .play-btn:active { transform: scale(.96); }
  .play-btn.playing { color: #ff6b81; border-color: #7a3a48; box-shadow: 0 0 22px -4px rgba(255,107,129,.45); }
  .param { flex: 1; min-width: 0; }
  .param-head {
    display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    font-size: 11px; color: var(--dim); letter-spacing: 1.5px;
  }
  .led {
    font-family: Consolas, "Courier New", monospace; font-size: 17px; font-weight: 700;
    color: #5df0a8; background: #060a12; border: 1px solid #1f2b45;
    padding: 1px 10px; border-radius: 6px; min-width: 58px; text-align: center;
    text-shadow: 0 0 8px rgba(93,240,168,.6);
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); cursor: pointer; }
  .tap {
    flex: 0 0 auto; height: 58px; padding: 0 16px;
    font-size: 12px; letter-spacing: 2px; font-weight: 700; color: #5df0a8;
    background: #0d1220; border: 1px solid #2c3752; border-radius: 12px;
    cursor: pointer; transition: all .12s;
  }
  .tap:hover { border-color: rgba(93,240,168,.6); box-shadow: 0 0 14px -6px rgba(93,240,168,.8); }
  .tap:active { transform: scale(.95); }

  /* ---------- toolbar ---------- */
  .toolbar { display: flex; gap: 12px 22px; flex-wrap: wrap; margin-bottom: 16px; }
  .group { display: flex; align-items: center; gap: 8px; }
  .group-label { font-size: 11px; color: var(--dim); letter-spacing: 2px; margin-right: 2px; }
  .chip {
    font-size: 13px; color: var(--text);
    background: #1a2135; border: 1px solid #2c3752; border-radius: 999px;
    padding: 6px 16px; cursor: pointer; transition: all .12s;
  }
  .chip:hover { border-color: var(--accent); color: #aab8ff; box-shadow: 0 0 14px -6px rgba(108,140,255,.8); }
  .chip:active { transform: scale(.95); }
  .chip.ghost { background: transparent; }
  .chip.active {
    background: var(--accent); border-color: var(--accent); color: #fff;
    box-shadow: 0 0 16px -4px rgba(108,140,255,.9);
  }
  .chip.bk { min-width: 40px; text-align: center; font-family: Consolas, monospace; font-weight: 700; }
  .chip.bk.dim { opacity: .45; }
  .copySel {
    font-size: 12px; color: var(--text); background: #1a2135;
    border: 1px solid #2c3752; border-radius: 8px; padding: 5px 8px; cursor: pointer;
  }
  .copySel:hover { border-color: var(--accent); }
  .copySel option { background: #1a2135; }

  /* ---------- board ---------- */
  .board { user-select: none; overflow-x: auto; padding-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .corner { flex: 0 0 182px; font-size: 10px; color: var(--dim); letter-spacing: 2px; padding-left: 4px; }
  .stepnum {
    flex: 0 0 32px; text-align: center;
    font-family: Consolas, monospace; font-size: 11px; color: #3d475f;
  }
  .stepnum.beat { color: #7c89a6; }

  .tlabel {
    flex: 0 0 96px; height: 38px;
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center;
    background: #101627; border: 1px solid var(--line); border-left: 3px solid var(--c);
    border-radius: 8px; padding-left: 10px; cursor: pointer;
    transition: filter .12s;
  }
  .tlabel:hover { filter: brightness(1.35); }
  .tlabel b { font-size: 13px; font-weight: 600; }
  .tlabel span { font-size: 9px; letter-spacing: 2px; color: var(--c); }

  .mute {
    flex: 0 0 28px; height: 38px;
    background: #101627; border: 1px solid var(--line); border-radius: 8px;
    color: var(--dim); font-size: 11px; font-weight: 700; cursor: pointer;
    transition: all .12s;
  }
  .mute:hover { border-color: #7a3a48; color: #ff6b81; }
  .mute.on { background: #3a1a24; border-color: #7a3a48; color: #ff6b81; box-shadow: 0 0 10px -4px rgba(255,107,129,.6); }

  .tvol { flex: 0 0 46px; height: 38px; accent-color: var(--c); cursor: pointer; }

  .cell {
    flex: 0 0 32px; height: 38px; border-radius: 8px;
    background: #171e30; border: 1px solid #252f49;
    cursor: pointer;
    transition: background .1s, box-shadow .1s, border-color .1s;
  }
  .cell.beat { background: #1c2438; }
  .cell:hover { border-color: #3d4a70; }
  .cell.gstart { margin-left: 10px; }
  .cell.on {
    background: var(--c);
    border-color: var(--c);
    box-shadow: 0 0 12px -2px var(--c);
  }
  .cell.on.acc {
    box-shadow: 0 0 14px -1px var(--c), inset 0 0 0 2px rgba(255,255,255,.75);
    filter: brightness(1.15);
  }
  .cell.now { border-color: #8fa3d9; box-shadow: 0 0 10px -3px rgba(143,163,217,.55); }
  .cell.on.now { filter: brightness(1.15); }
  .row.muted .cell { opacity: .35; }
  @keyframes hit {
    0%   { filter: brightness(2.3); transform: scale(1.14); }
    100% { filter: brightness(1);   transform: scale(1); }
  }
  .cell.hit { animation: hit .16s ease-out; }

  /* ---------- footer / toast ---------- */
  .hints {
    display: flex; gap: 20px; flex-wrap: wrap;
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--dim);
  }
  kbd {
    background: #1a2135; border: 1px solid #2c3752; border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 7px; font-size: 11px; color: var(--text);
    font-family: Consolas, monospace;
  }
  .hire { color: var(--dim); text-decoration: none; transition: color .12s; }
  .hire:hover { color: #5df0a8; }
  .toast {
    position: fixed; left: 50%; bottom: 34px;
    transform: translateX(-50%) translateY(20px);
    background: #1a2135; border: 1px solid var(--accent); color: var(--text);
    font-size: 13px; padding: 9px 18px; border-radius: 999px;
    opacity: 0; pointer-events: none; transition: all .25s;
    box-shadow: 0 10px 30px -10px rgba(0,0,0,.7); z-index: 99;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="machine">
  <header class="top">
    <div class="brand">
      <div class="logo">◉</div>
      <div>
        <h1>DRUM-909 <span style="color:#5df0a8">V2</span></h1>
        <p>网页鼓机音序器 · 音色库 / 循环曲 / 重音 / 分享</p>
      </div>
    </div>
    <span class="badge">4 BANKS · 16 STEPS · 6 TRACKS</span>
  </header>

  <section class="transport">
    <button id="playBtn" class="play-btn" title="播放 / 停止（空格）">▶</button>
    <div class="param">
      <div class="param-head"><span>BPM 速度</span><span id="bpmLed" class="led">110</span></div>
      <input id="bpmSlider" type="range" min="60" max="200" value="110">
    </div>
    <div class="param">
      <div class="param-head"><span>SWING 摇摆</span><span id="swingLed" class="led">0%</span></div>
      <input id="swingSlider" type="range" min="0" max="60" value="0">
    </div>
    <div class="param">
      <div class="param-head"><span>VOL 音量</span><span id="volLed" class="led">80</span></div>
      <input id="volSlider" type="range" min="0" max="100" value="80">
    </div>
    <button id="tapBtn" class="tap" title="连打测速：按节奏点几下">TAP</button>
  </section>

  <section class="toolbar">
    <div class="group">
      <span class="group-label">预置节奏</span>
      <button class="chip" data-preset="rock">摇滚</button>
      <button class="chip" data-preset="house">House</button>
      <button class="chip" data-preset="trap">Trap</button>
      <button class="chip" data-preset="brk">Break</button>
      <button class="chip" data-preset="funk">Funk</button>
      <button class="chip" data-preset="dnb">DnB</button>
    </div>
    <div class="group">
      <span class="group-label">音色库</span>
      <button class="chip bk active" data-bank="0" title="音色库 A">A</button>
      <button class="chip bk" data-bank="1" title="音色库 B">B</button>
      <button class="chip bk" data-bank="2" title="音色库 C">C</button>
      <button class="chip bk" data-bank="3" title="音色库 D">D</button>
      <select id="copySel" class="copySel" title="复制当前音色库到…">
        <option value="">复制到…</option>
        <option value="0">→ A</option>
        <option value="1">→ B</option>
        <option value="2">→ C</option>
        <option value="3">→ D</option>
      </select>
    </div>
    <div class="group">
      <span class="group-label">播放模式</span>
      <button class="chip mchip active" data-mode="p" title="只循环当前音色库">单节奏</button>
      <button class="chip mchip" data-mode="s" title="依次循环所有非空音色库 A→B→C→D">循环曲</button>
    </div>
    <div class="group">
      <span class="group-label">编辑</span>
      <button class="chip ghost" id="clearBtn">清空</button>
      <button class="chip ghost" id="randomBtn">随机 🎲</button>
      <button class="chip ghost" id="shareBtn" title="复制含当前全部内容的链接">分享 🔗</button>
      <button class="chip ghost" id="resetBtn" title="清空所有音色库并恢复默认">重置</button>
    </div>
  </section>

  <section class="board" id="board"></section>

  <footer class="hints">
    <span><kbd>空格</kbd> 播放 / 停止</span>
    <span>点格子：开 → <b>重音</b> → 关</span>
    <span><kbd>1</kbd>–<kbd>6</kbd> 试听音色</span>
    <span>每轨右侧滑杆调音量</span>
    <span>「循环曲」依次播放非空音色库</span>
    <a class="hire" href="hire.html">🛠 网页定制接单</a>
  </footer>
</div>
<div id="toast" class="toast"></div>

<script>
'use strict';

/* ================= 配置与状态 ================= */
const TRACKS = [
  { id: 'kick',  name: '底鼓', en: 'KICK',   color: '#f5a524' },
  { id: 'snare', name: '军鼓', en: 'SNARE',  color: '#fb7185' },
  { id: 'clap',  name: '拍手', en: 'CLAP',   color: '#a78bfa' },
  { id: 'chat',  name: '闭镲', en: 'CH HAT', color: '#22d3ee' },
  { id: 'ohat',  name: '开镲', en: 'OP HAT', color: '#34d399' },
  { id: 'tom',   name: '桶鼓', en: 'TOM',    color: '#f472b6' },
];
const STEPS = 16, NBANKS = 4, LS_KEY = 'drum909v2';

/* 步进值：0 = 关，1 = 常规，2 = 重音 */
let banks   = Array.from({ length: NBANKS }, () => TRACKS.map(() => Array(STEPS).fill(0)));
let muted   = TRACKS.map(() => false);
let trackVol = TRACKS.map(() => 100);
let cur = 0, mode = 'p';           // mode: 'p' 单节奏 | 's' 循环曲
const cellEls = TRACKS.map(() => []);
const rowEls = [], muteEls = [], tvolEls = [];

let bpm = 110, swing = 0;
let playing = false, timerID = null, currentStep = 0, nextNoteTime = 0;
let notesInQueue = [], uiStep = -2;

/* ================= 音频引擎 ================= */
let ctx = null, master = null, noiseBuf = null, trackGains = null;

function ensureAudio() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain();
    master.gain.value = (+volSlider.value / 100) * 0.9;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp);
    comp.connect(ctx.destination);
    trackGains = TRACKS.map((_, i) => {
      const g = ctx.createGain();
      g.gain.value = trackVol[i] / 100;
      g.connect(master);
      return g;
    });
  }
  if (ctx.state === 'suspended') ctx.resume();
}

function getNoise() {
  if (!noiseBuf) {
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  return noiseBuf;
}

/* v：力度（1 常规 / 1.35 重音）；out：输出节点（每轨 gain） */
const voices = {
  kick(t, v, out) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(160, t);
    o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(1.05 * v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + 0.5);
    // 起振 click
    const n = ctx.createBufferSource(); n.buffer = getNoise();
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1500;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.25 * v, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
    n.connect(hp); hp.connect(ng); ng.connect(out);
    n.start(t); n.stop(t + 0.03);
  },
  snare(t, v, out) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(190, t);
    o.frequency.exponentialRampToValueAtTime(120, t + 0.08);
    g.gain.setValueAtTime(0.7 * v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + 0.15);
    const n = ctx.createBufferSource(); n.buffer = getNoise();
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1800; bp.Q.value = 0.6;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.8 * v, t);
    ng.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
    n.connect(bp); bp.connect(ng); ng.connect(out);
    n.start(t); n.stop(t + 0.25);
  },
  clap(t, v, out) {
    const n = ctx.createBufferSource(); n.buffer = getNoise();
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1100; bp.Q.value = 1.2;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    [[0, 0.55], [0.012, 0.45], [0.024, 0.5]].forEach(([dt, peak]) => {
      g.gain.setValueAtTime(peak * v, t + dt);
      g.gain.exponentialRampToValueAtTime(0.03, t + dt + 0.01);
    });
    g.gain.setValueAtTime(0.5 * v, t + 0.036);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    n.connect(bp); bp.connect(g); g.connect(out);
    n.start(t); n.stop(t + 0.3);
  },
  hat(t, open, v, out) {
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 8000;
    const g = ctx.createGain();
    const dur = open ? 0.45 : 0.06;
    g.gain.setValueAtTime((open ? 0.32 : 0.42) * v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    [2, 3, 4.16, 5.43, 6.79, 8.21].forEach(r => {
      const o = ctx.createOscillator();
      o.type = 'square'; o.frequency.value = 40 * r;
      o.connect(hp);
      o.start(t); o.stop(t + dur + 0.02);
    });
    hp.connect(g); g.connect(out);
  },
  tom(t, v, out) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(130, t);
    o.frequency.exponentialRampToValueAtTime(72, t + 0.25);
    g.gain.setValueAtTime(0.9 * v, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    o.connect(g); g.connect(out);
    o.start(t); o.stop(t + 0.4);
  },
};

/* 统一触发入口：闭镲/开镲共用 hat()，靠 open 参数区分 */
function trigger(tr, t, vel = 1, idx = 0) {
  const out = trackGains ? trackGains[idx] : master;
  if (tr.id === 'chat') voices.hat(t, false, vel, out);
  else if (tr.id === 'ohat') voices.hat(t, true, vel, out);
  else voices[tr.id](t, vel, out);
}

/* ================= 调度器（lookahead） ================= */
const LOOKAHEAD = 25, SCHEDULE_AHEAD = 0.12;
const stepDur = () => 60 / bpm / 4;

function bankEmpty(i) {
  return banks[i].every(row => row.every(v => !v));
}

/* 循环曲模式：跳到下一个非空音色库（含绕回自身） */
function advanceSongBank() {
  for (let k = 1; k <= NBANKS; k++) {
    const i = (cur + k) % NBANKS;
    if (!bankEmpty(i)) { cur = i; break; }
  }
  updateBankChips();
  refreshGrid();
}

function scheduler() {
  while (nextNoteTime < ctx.currentTime + SCHEDULE_AHEAD) {
    let t = nextNoteTime;
    if (currentStep % 2 === 1) t += stepDur() * (swing / 100) * 0.5;
    notesInQueue.push({ step: currentStep, time: t });
    const bk = banks[cur];
    TRACKS.forEach((tr, i) => {
      const v = bk[i][currentStep];
      if (v && !muted[i]) trigger(tr, t, v === 2 ? 1.35 : 1, i);
    });
    nextNoteTime += stepDur();
    const ns = (currentStep + 1) % STEPS;
    if (ns === 0 && mode === 's') advanceSongBank();
    currentStep = ns;
  }
}

function draw() {
  if (playing && ctx) {
    while (notesInQueue.length && notesInQueue[0].time <= ctx.currentTime) {
      uiStep = notesInQueue[0].step;
      notesInQueue.shift();
    }
    if (uiStep !== draw.last) {
      draw.last = uiStep;
      for (let s = 0; s < STEPS; s++)
        for (let t = 0; t < TRACKS.length; t++)
          cellEls[t][s].classList.toggle('now', s === uiStep);
      if (uiStep >= 0)
        for (let t = 0; t < TRACKS.length; t++)
          if (banks[cur][t][uiStep] && !muted[t]) flash(cellEls[t][uiStep]);
    }
  }
  requestAnimationFrame(draw);
}
draw.last = -2;
requestAnimationFrame(draw);

function start() {
  ensureAudio();
  if (mode === 's' && bankEmpty(cur)) advanceSongBank();
  currentStep = 0;
  nextNoteTime = ctx.currentTime + 0.06;
  notesInQueue = [];
  playing = true;
  timerID = setInterval(scheduler, LOOKAHEAD);
  playBtn.classList.add('playing');
  playBtn.textContent = '⏹';
}
function stop() {
  playing = false;
  clearInterval(timerID);
  notesInQueue = [];
  uiStep = -2; draw.last = -2;
  for (let s = 0; s < STEPS; s++)
    for (let t = 0; t < TRACKS.length; t++)
      cellEls[t][s].classList.remove('now', 'hit');
  playBtn.classList.remove('playing');
  playBtn.textContent = '▶';
}
function togglePlay() { playing ? stop() : start(); }

/* ================= 构建网格 UI ================= */
const board = document.getElementById('board');
(function buildBoard() {
  const head = document.createElement('div');
  head.className = 'row';
  const corner = document.createElement('div');
  corner.className = 'corner';
  corner.textContent = '音轨 / 步 / 音量';
  head.appendChild(corner);
  for (let s = 0; s < STEPS; s++) {
    const num = document.createElement('div');
    num.className = 'stepnum' + (s % 4 === 0 ? ' beat' : '') + (s % 4 === 0 && s > 0 ? ' gstart' : '');
    num.textContent = s % 4 === 0 ? (s / 4 + 1) : '·';
    head.appendChild(num);
  }
  board.appendChild(head);

  TRACKS.forEach((tr, t) => {
    const row = document.createElement('div');
    row.className = 'row';
    rowEls.push(row);

    const label = document.createElement('button');
    label.className = 'tlabel';
    label.style.setProperty('--c', tr.color);
    label.title = '试听 ' + tr.name;
    label.innerHTML = `<b>${tr.name}</b><span>${tr.en}</span>`;
    label.addEventListener('click', () => {
      ensureAudio();
      trigger(tr, ctx.currentTime + 0.001, 1, t);
    });
    row.appendChild(label);

    const mute = document.createElement('button');
    mute.className = 'mute';
    mute.textContent = 'M';
    mute.title = '静音 / 取消静音';
    mute.addEventListener('click', () => {
      muted[t] = !muted[t];
      mute.classList.toggle('on', muted[t]);
      row.classList.toggle('muted', muted[t]);
      save();
    });
    row.appendChild(mute);
    muteEls.push(mute);

    const tvol = document.createElement('input');
    tvol.type = 'range'; tvol.className = 'tvol';
    tvol.min = 0; tvol.max = 100; tvol.value = trackVol[t];
    tvol.title = tr.name + ' 音量';
    tvol.style.setProperty('--c', tr.color);
    tvol.addEventListener('input', () => {
      trackVol[t] = +tvol.value;
      if (trackGains && trackGains[t])
        trackGains[t].gain.setTargetAtTime(trackVol[t] / 100, ctx.currentTime, 0.02);
      save();
    });
    row.appendChild(tvol);
    tvolEls.push(tvol);

    for (let s = 0; s < STEPS; s++) {
      const cell = document.createElement('div');
      cell.className = 'cell' + (s % 4 === 0 ? ' beat' : '') + (s % 4 === 0 && s > 0 ? ' gstart' : '');
      cell.style.setProperty('--c', tr.color);
      cell.title = `${tr.name} · 第 ${s + 1} 步`;
      cell.addEventListener('click', () => {
        const v = (banks[cur][t][s] + 1) % 3;   // 关 → 常规 → 重音 → 关
        banks[cur][t][s] = v;
        cell.classList.toggle('on', v > 0);
        cell.classList.toggle('acc', v === 2);
        if (v > 0) {
          ensureAudio();
          trigger(tr, ctx.currentTime + 0.001, v === 2 ? 1.35 : 1, t);
          flash(cell);
        }
        updateBankChips();
        save();
      });
      cellEls[t].push(cell);
      row.appendChild(cell);
    }
    board.appendChild(row);
  });
})();

function flash(el) {
  el.classList.remove('hit');
  void el.offsetWidth;
  el.classList.add('hit');
}
function refreshGrid() {
  TRACKS.forEach((_, t) => {
    for (let s = 0; s < STEPS; s++) {
      cellEls[t][s].classList.toggle('on', banks[cur][t][s] > 0);
      cellEls[t][s].classList.toggle('acc', banks[cur][t][s] === 2);
    }
  });
}

/* ================= 音色库 chips / 模式 ================= */
const bankChips = Array.from(document.querySelectorAll('[data-bank]'));
function updateBankChips() {
  bankChips.forEach((c, i) => {
    c.classList.toggle('active', i === cur);
    c.classList.toggle('dim', bankEmpty(i));
    c.textContent = 'ABCD'[i] + (bankEmpty(i) ? ' ·' : '');
  });
}
bankChips.forEach((c, i) => c.addEventListener('click', () => {
  cur = i;
  refreshGrid();
  updateBankChips();
  save();
}));

const modeChips = Array.from(document.querySelectorAll('.mchip'));
function syncModeChips() {
  modeChips.forEach(c => c.classList.toggle('active', c.dataset.mode === mode));
}
modeChips.forEach(c => c.addEventListener('click', () => {
  mode = c.dataset.mode;
  syncModeChips();
  save();
}));

/* 复制当前音色库到目标 */
const copySel = document.getElementById('copySel');
copySel.addEventListener('change', () => {
  const to = +copySel.value;
  if (copySel.value === '' || to === cur) { copySel.selectedIndex = 0; return; }
  banks[to] = banks[cur].map(r => r.slice());
  copySel.selectedIndex = 0;
  updateBankChips();
  save();
  toast(`已复制到音色库 ${'ABCD'[to]}`);
});

/* ================= 预置节奏（2 = 重音） ================= */
const PRESETS = {
  rock: {
    bpm: 120, swing: 0, rows: {
      kick:  '1000100010001000',
      snare: '0000200000002000',
      chat:  '1010101010101010',
    }
  },
  house: {
    bpm: 124, swing: 0, rows: {
      kick:  '1000100010001000',
      clap:  '0000200000002000',
      chat:  '1000100010001000',
      ohat:  '0010001000100010',
    }
  },
  trap: {
    bpm: 140, swing: 0, rows: {
      kick:  '1000001000100000',
      snare: '0000000020000000',
      chat:  '1111111111111111',
    }
  },
  brk: {
    bpm: 165, swing: 0, rows: {
      kick:  '1010000000100000',
      snare: '0000200000002000',
      chat:  '1010101010101010',
      tom:   '0000000000000001',
    }
  },
  funk: {
    bpm: 102, swing: 15, rows: {
      kick:  '1000100001100010',
      snare: '0000200000002001',
      chat:  '1011101110111011',
      ohat:  '0000000000100000',
    }
  },
  dnb: {
    bpm: 172, swing: 0, rows: {
      kick:  '1000000000100000',
      snare: '0000200000002000',
      chat:  '1010101010101010',
      ohat:  '0010000000100010',
    }
  },
};

function syncSliders() {
  bpmSlider.value = bpm;   bpmLed.textContent = bpm;
  swingSlider.value = swing; swingLed.textContent = swing + '%';
  volLed.textContent = volSlider.value;
}
function applyPreset(p) {
  const bk = banks[cur];
  TRACKS.forEach((tr, i) => {
    const str = p.rows[tr.id] || '0'.repeat(STEPS);
    for (let s = 0; s < STEPS; s++) bk[i][s] = str[s] === '2' ? 2 : str[s] === '1' ? 1 : 0;
  });
  bpm = p.bpm; swing = p.swing || 0;
  syncSliders();
  refreshGrid();
  updateBankChips();
  save();
}

/* ================= 随机 / 清空 ================= */
function randomize() {
  const prob = { kick: 0.28, snare: 0.10, clap: 0.10, chat: 0.5, ohat: 0.08, tom: 0.06 };
  const bk = banks[cur];
  TRACKS.forEach((tr, i) => {
    for (let s = 0; s < STEPS; s++) {
      let p = prob[tr.id];
      if (tr.id === 'kick' && s === 0) p = 0.9;
      if (tr.id === 'snare' && (s === 4 || s === 12)) p = 0.7;
      const hit = Math.random() < p;
      const acc = hit && ((tr.id === 'kick' && s === 0) || (tr.id === 'snare' && (s === 4 || s === 12)));
      bk[i][s] = hit ? (acc ? 2 : 1) : 0;
    }
  });
  refreshGrid();
  updateBankChips();
  save();
}
function clearAll() {
  banks[cur].forEach(row => row.fill(0));
  refreshGrid();
  updateBankChips();
  save();
}
function resetAll() {
  banks = Array.from({ length: NBANKS }, () => TRACKS.map(() => Array(STEPS).fill(0)));
  muted = TRACKS.map(() => false);
  trackVol = TRACKS.map(() => 100);
  if (trackGains) trackGains.forEach((g, i) => g.gain.value = 1);
  muteEls.forEach((m, i) => {
    m.classList.remove('on');
    rowEls[i].classList.remove('muted');
  });
  tvolEls.forEach(el => el.value = 100);
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  history.replaceState(null, '', location.pathname + location.search);
  cur = 0; mode = 'p';
  syncModeChips();
  applyPreset(PRESETS.rock);
  toast('已重置');
}

/* ================= 保存 / 载入 / 分享 ================= */
function packState() {
  return {
    v: 1, b: bpm, s: swing, c: cur,
    m: muted.map(x => x ? 1 : 0).join(''),
    vo: volSlider.value, tv: trackVol.join(','),
    k: banks.map(bk => bk.map(r => r.join('')).join('|')).join('?'),
  };
}
function unpackState(o) {
  const ks = String(o.k).split('?');
  if (ks.length !== NBANKS) throw new Error('bad banks');
  banks = ks.map(bk => {
    const rows = bk.split('|');
    if (rows.length !== TRACKS.length) throw new Error('bad rows');
    return rows.map(r => {
      if (r.length !== STEPS) throw new Error('bad steps');
      return r.split('').map(ch => {
        const n = +ch;
        return n >= 0 && n <= 2 ? n : 0;
      });
    });
  });
  cur = Math.min(NBANKS - 1, Math.max(0, o.c | 0));
  if (String(o.m).length !== TRACKS.length) throw new Error('bad mute');
  muted = String(o.m).split('').map(Number).map(Boolean);
  bpm = Math.min(200, Math.max(60, +o.b || 110));
  swing = Math.min(60, Math.max(0, +o.s || 0));
  volSlider.value = Math.min(100, Math.max(0, +o.vo || 80));
  const tv = String(o.tv).split(',').map(Number);
  trackVol = TRACKS.map((_, i) => (tv[i] >= 0 && tv[i] <= 100) ? tv[i] : 100);
  if (trackGains) trackGains.forEach((g, i) => g.gain.value = trackVol[i] / 100);
  syncUI();
}
function syncUI() {
  syncSliders();
  tvolEls.forEach((el, i) => el.value = trackVol[i]);
  muteEls.forEach((m, i) => {
    m.classList.toggle('on', muted[i]);
    rowEls[i].classList.toggle('muted', muted[i]);
  });
  refreshGrid();
  updateBankChips();
  syncModeChips();
}

let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(LS_KEY, JSON.stringify(packState())); } catch (e) {}
  }, 250);
}

let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  if (ok) done();
  else {
    location.hash = text.split('#')[1] || '';
    toast('已写入地址栏，请手动复制');
  }
}
function share() {
  const url = location.href.split('#')[0] + '#d=' + btoa(JSON.stringify(packState()));
  const done = () => toast('分享链接已复制 📋');
  if (navigator.clipboard && navigator.clipboard.writeText)
    navigator.clipboard.writeText(url).then(done, () => fallbackCopy(url, done));
  else fallbackCopy(url, done);
}

/* ================= 控件绑定 ================= */
const playBtn     = document.getElementById('playBtn');
const bpmSlider   = document.getElementById('bpmSlider');
const swingSlider = document.getElementById('swingSlider');
const volSlider   = document.getElementById('volSlider');
const bpmLed      = document.getElementById('bpmLed');
const swingLed    = document.getElementById('swingLed');
const volLed      = document.getElementById('volLed');

playBtn.addEventListener('click', togglePlay);
bpmSlider.addEventListener('input', () => { bpm = +bpmSlider.value; bpmLed.textContent = bpm; save(); });
swingSlider.addEventListener('input', () => { swing = +swingSlider.value; swingLed.textContent = swing + '%'; save(); });
volSlider.addEventListener('input', () => {
  volLed.textContent = volSlider.value;
  if (master) master.gain.setTargetAtTime((+volSlider.value / 100) * 0.9, ctx.currentTime, 0.02);
  save();
});
document.querySelectorAll('[data-preset]').forEach(btn =>
  btn.addEventListener('click', () => applyPreset(PRESETS[btn.dataset.preset])));
document.getElementById('clearBtn').addEventListener('click', clearAll);
document.getElementById('randomBtn').addEventListener('click', randomize);
document.getElementById('shareBtn').addEventListener('click', share);
document.getElementById('resetBtn').addEventListener('click', resetAll);

/* TAP 测速：按节奏点几下，取平均间隔 */
let taps = [];
document.getElementById('tapBtn').addEventListener('click', () => {
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now);
  if (taps.length > 6) taps.shift();
  if (taps.length >= 2) {
    const iv = (taps[taps.length - 1] - taps[0]) / (taps.length - 1);
    bpm = Math.min(200, Math.max(60, Math.round(60000 / iv)));
    bpmSlider.value = bpm;
    bpmLed.textContent = bpm;
    save();
  }
});

window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    e.preventDefault();
    // 防止焦点停在按钮上时触发二次点击
    if (document.activeElement && document.activeElement.tagName === 'BUTTON')
      document.activeElement.blur();
    togglePlay();
    return;
  }
  const m = /^Digit([1-6])$/.exec(e.code);
  if (m && !e.repeat) {
    const i = +m[1] - 1;
    ensureAudio();
    trigger(TRACKS[i], ctx.currentTime + 0.001, 1, i);
  }
});

/* 点击按钮后移除焦点，避免空格键误触发 */
document.addEventListener('click', e => {
  const b = e.target.closest('button');
  if (b) b.blur();
});

/* 初始状态：URL 分享链接 > 本地存档 > 默认预置（须在控件常量声明之后执行） */
(function load() {
  let st = null;
  if (location.hash.length > 3) {
    try { st = JSON.parse(atob(location.hash.slice(3))); } catch (e) {}
  }
  if (!st) {
    try {
      const raw = localStorage.getItem(LS_KEY);
      if (raw) st = JSON.parse(raw);
    } catch (e) {}
  }
  if (st) {
    try { unpackState(st); return; } catch (e) {}
  }
  applyPreset(PRESETS.rock);
})();
</script>
